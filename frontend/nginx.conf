# nginx configuration for the dashboard container.
#
# Serves the built SPA and proxies /api and /ws to the backend, so the browser
# sees one origin. That keeps CORS out of the deployment and makes the
# WebSocket upgrade behave the same as it does in development.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers. The CSP is deliberately strict: the application loads no
    # third-party scripts and no external tiles, so nothing legitimate needs a
    # wider policy. Only the Google Fonts stylesheet and font files are external.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # A name that says what this is, without advertising the version.
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/geo+json image/svg+xml;
    gzip_min_length 1024;

    # Hashed assets never change, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Exports of a long run can take a while to assemble.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 48m;
    }

    location /ws/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The live stream is long-lived; do not time it out mid-watch.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA routing: unknown paths return the shell, which then routes client-side.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
