<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#05080f" />
    <meta
      name="description"
      content="iSpatialTec Assured Marine Navigation Platform - resilient positioning and integrity monitoring when GNSS cannot be trusted. Demonstration system, not for navigation."
    />
    <meta name="robots" content="noindex, nofollow" />
    <title>AMNP · Assured Marine Navigation</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0f1a'/%3E%3Cpath d='M16 5 L20 20 L16 17 L12 20 Z' fill='%2312b981'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%233b5178' stroke-width='1.5'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-bridge-950 text-bridge-100 antialiased">
    <script>
      /*
       * Apply the stored theme before first paint.
       *
       * Without this the document renders in the dark default and then repaints
       * into light a frame later - a white flash on every load for anyone who
       * has chosen the light palette. Deliberately inline and synchronous: it
       * has to run before the body is painted, and it must never throw, because
       * a private window with storage blocked would otherwise take the whole
       * application down before the bundle loads.
       */
      (function () {
        try {
          var prefs = JSON.parse(localStorage.getItem('amnp.preferences') || '{}');
          var pref = prefs.theme === 'light' || prefs.theme === 'system' ? prefs.theme : 'dark';
          var resolved =
            pref === 'system'
              ? window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
              : pref;
          var root = document.documentElement;
          root.dataset.theme = resolved;
          root.classList.toggle('dark', resolved === 'dark');
          root.style.colorScheme = resolved;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', resolved === 'dark' ? '#05080f' : '#eef2f7');
        } catch (e) {
          /* Storage unavailable - the dark default already applied is correct. */
        }
      })();
    </script>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui; color: #dde6f2; background: #0a0f1a">
        <h1>JavaScript is required</h1>
        <p>
          The Assured Marine Navigation dashboard needs JavaScript to display live navigation integrity data.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
